name: ICON-D2-RUC Wetterkarten

on:
  workflow_dispatch:
  schedule:
    - cron: '55 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: icon-d2-ruc-pages
  cancel-in-progress: false

jobs:
  wetterkarten:
    name: Wetterkarten erzeugen und vollständig prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Bibliotheken installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: ICON-D2-RUC-Wetterkarten erzeugen
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: python icon_ruc_github.py

      - name: Alle 27 Stunden und alle 9 Parameter prüfen
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          from PIL import Image

          out = Path('output')
          meta = out / 'icon_d2_ruc_tirol_metadata.json'
          if not meta.is_file():
              raise RuntimeError('Metadatendatei fehlt')
          data = json.loads(meta.read_text(encoding='utf-8'))

          expected = {
              'temperature_2m', 'precipitation',
              'precipitation_sum', 'cloud_cover',
              'cloud_low', 'cloud_mid', 'cloud_high',
              'wind_gusts', 'snowfall'
          }
          params = data.get('parameters', {})
          if set(params) != expected:
              raise RuntimeError(
                  'Parameter-Abweichung: ' +
                  str(sorted(set(params) ^ expected))
              )

          def parse_time(value):
              date = datetime.fromisoformat(value.replace('Z', '+00:00'))
              if date.tzinfo is None:
                  raise RuntimeError('Zeitstempel ohne Zeitzone')
              return date.astimezone(timezone.utc)

          run = parse_time(data['model_run_utc'])
          now = datetime.now(timezone.utc)
          age = now - run
          if not timedelta(0) <= age <= timedelta(hours=8):
              raise RuntimeError('Modelllauf ist zu alt oder liegt in der Zukunft: ' + str(run))

          bounds = data.get('bounds')
          if not isinstance(bounds, list) or len(bounds) != 2:
              raise RuntimeError('Kartengrenzen fehlen')
          encoding = data.get('values_encoding', {})
          if encoding.get('kind') != 'png-rg16-offset':
              raise RuntimeError('Werte-PNG-Kodierung unerwartet')

          referenced = {meta.name}
          image_count = 0
          for name in sorted(expected):
              item = params[name]
              frames = item.get('frames', [])
