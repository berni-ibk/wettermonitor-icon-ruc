name: Tirol-Relief einmalig erzeugen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-relief.txt'
      - name: Benötigte Python-Pakete installieren
        run: python -m pip install -r requirements-relief.txt
      - name: Tirol-Relief erzeugen
        run: python relief_tirol_erzeugen.py
      - name: Größe und Bildformat überprüfen
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          file = Path('tirol_relief.png')
          assert file.is_file(), 'Relief wurde nicht erzeugt'
          with Image.open(file) as img:
              print('Bildgröße:', img.size, 'Format:', img.format)
              assert img.size == (2200, 1500), 'Unerwartete Bildabmessungen'
          print('Dateigröße:', round(file.stat().st_size / 1048576, 2), 'MiB')
          PY
      - name: Relief zum einmaligen Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: tirol-relief-download
          path: tirol_relief.png
          if-no-files-found: error
          retention-days: 1
