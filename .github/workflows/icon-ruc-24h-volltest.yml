
name: ICON-D2-RUC 24h Volltest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volltest:
    name: 24 Stunden erzeugen und prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy scipy matplotlib requests \
            pillow eccodes netCDF4

      - name: Separate 24h-Testversion erzeugen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          source = Path("icon_ruc_github.py")
          target = Path("icon_ruc_24h_test.py")

          if not source.is_file():
              raise RuntimeError(
                  "Produktiver Python-Generator fehlt"
              )

          code = source.read_text(
              encoding="utf-8"
          )

          changes = {
              "HOURS = list(range(1,13))":
                  "HOURS = list(range(1,25))",

              "if len(frames)!=12:":
                  "if len(frames)!=24:",

              "12 Wetterbilder und 12 Wertebilder geprüft":
                  "24 Wetterbilder und 24 Wertebilder geprüft",

              "12*len(PARAMS)":
                  "24*len(PARAMS)"
          }

          for old, new in changes.items():
              count = code.count(old)

              if count < 1:
                  raise RuntimeError(
                      "Erwartete Stelle nicht gefunden: "
                      + old
                  )

              code = code.replace(old, new)

              print(
                  "Anpassung:",
                  old,
                  "->",
                  new
              )

          ast.parse(code)

          target.write_text(
              code,
              encoding="utf-8"
          )

          print(
              "\n24h-Testversion erfolgreich erstellt."
          )
          print(
              "Produktiver Generator bleibt unverändert."
          )
          PY

      - name: Alle 24 Prognosestunden erzeugen
        shell: bash
        run: |
          python -u icon_ruc_24h_test.py

      - name: Ergebnis und Speicherbedarf prüfen
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("output")
          metadata_path = (
              out /
              "icon_d2_ruc_tirol_metadata.json"
          )

          if not metadata_path.exists():
              raise RuntimeError(
                  "Metadatendatei fehlt"
              )

          data = json.loads(
              metadata_path.read_text(
                  encoding="utf-8"
              )
          )

          params = data["parameters"]

          if len(params) != 9:
              raise RuntimeError(
                  "Nicht genau neun Wetterparameter"
              )

          for name, config in params.items():
              frames = config["frames"]
              hours = [
                  frame["forecast_hour"]
                  for frame in frames
              ]

              if hours != list(range(1, 25)):
                  raise RuntimeError(
                      f"Unvollständige Stunden: {name}"
                  )

              for frame in frames:
                  for field in (
                      "image",
                      "values_image"
                  ):
                      path = out / frame[field]

                      if (
                          not path.is_file()
                          or path.stat().st_size == 0
                      ):
                          raise RuntimeError(
                              f"Datei fehlt: {path}"
                          )

              print(
                  f"{name}: 24 Wetterkarten "
                  "und 24 Wertekarten OK"
              )

          files = [
              p for p in out.iterdir()
              if p.is_file()
          ]

          total_bytes = sum(
              p.stat().st_size
              for p in files
          )

          total_mb = (
              total_bytes / 1024 / 1024
          )

          png_files = [
              p for p in files
              if p.suffix.lower() == ".png"
          ]

          print()
          print(
              "Modelllauf:",
              data["model_run_utc"]
          )
          print(
              "PNG-Dateien:",
              len(png_files)
          )
          print(
              "Gesamtzahl Ausgabedateien:",
              len(files)
          )
          print(
              "Gesamtgröße:",
              round(total_mb, 2),
              "MB"
          )

          if len(png_files) != 441:
              raise RuntimeError(
                  "Erwartet: 432 Wetter-/Wertebilder "
                  "und 9 Legenden"
              )

          if total_mb >= 900:
              raise RuntimeError(
                  "Ausgabe zu groß für einen "
                  "sicheren GitHub-Pages-Betrieb"
              )

          summary = [
              "## ICON-D2-RUC 24h Volltest",
              "",
              f"- Modelllauf: {data['model_run_utc']}",
              "- Wetterparameter: 9",
              "- Prognosestunden: 24",
              "- Wetter-/Wertebilder: 432",
              "- Legenden: 9",
              f"- Größe: {total_mb:.2f} MB",
              "",
              "Alle Prüfungen erfolgreich."
          ]

          import os

          summary_file = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )

          if summary_file:
              with open(
                  summary_file,
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "\n".join(summary) + "\n"
                  )

          print(
              "\n24-STUNDEN-VOLLTEST "
              "ERFOLGREICH ABGESCHLOSSEN"
          )
          PY
