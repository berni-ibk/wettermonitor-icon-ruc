name: Tirol-Grenzen einmalig erzeugen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grenzen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Abhängigkeiten installieren
        run: python -m pip install 'requests>=2.31,<3' 'shapely>=2,<3'
      - name: Landes- und Bezirksgrenzen erzeugen
        run: python tirol_grenzen_erzeugen.py
      - name: Dateien prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('tirol_landesgrenze.geojson','tirol_bezirksgrenzen.geojson'):
              p=Path('grenzen_tirol')/name
              d=json.loads(p.read_text())
              assert d['type']=='FeatureCollection' and d['features'],name
              print(name,round(p.stat().st_size/1024,1),'KB',len(d['features']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tirol-grenzen-download
          path: grenzen_tirol/*.geojson
          retention-days: 2
